name: Admin Closure Compile Gate 20260907
on:
  push:
    branches:
      - work/admin-operations-closure-20260906
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript gate
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff integrity
        run: git diff --check
