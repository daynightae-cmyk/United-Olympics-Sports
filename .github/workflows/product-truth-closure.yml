name: Product Truth Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/product-truth-closure.yml

permissions:
  contents: write

jobs:
  close-truth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove forbidden fallback and hard reload patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'src/pages/product-preview/ProductPreviewPages.tsx': [
              ('const player = getPlayer("player-demo-001") ?? demoPlayers[0];', 'const player = getPlayer("player-demo-001") ?? demoPlayers.find((item) => item.id === "player-demo-001");\n  if (!player) return null;'),
              ('const player = getPlayer(selectedId) ?? demoPlayers[0];', 'const player = getPlayer(selectedId) ?? demoPlayers.find((item) => item.id === selectedId);\n  if (!player) return null;'),
            ],
            'src/pages/benchmark/BenchmarkShowcasePage.tsx': [
              ('export function BenchmarkShowcasePage() {', 'export function BenchmarkShowcasePage() {\n  const benchmarkPlayer = demoPlayers.find((player) => Boolean(player));'),
              ('name={{ en: demoPlayers[0].nameEn, ar: demoPlayers[0].nameAr }}', "name={benchmarkPlayer ? { en: benchmarkPlayer.nameEn, ar: benchmarkPlayer.nameAr } : bi('Preview Player', 'لاعب تجريبي')}"),
              ('id={demoPlayers[0].id}', "id={benchmarkPlayer?.id ?? 'preview-player'}"),
              ("getSport(demoPlayers[0].sportId)?.name", "benchmarkPlayer ? getSport(benchmarkPlayer.sportId)?.name : undefined"),
              ("demoPlayers[0].age ?? '—'", "benchmarkPlayer?.age ?? '—'"),
              ('<BilingualText value={demoPlayers[0].level} />', "<BilingualText value={benchmarkPlayer?.level ?? bi('—', '—')} />"),
            ],
            'src/platform/UpdateToast.tsx': [
              ('window.location.reload()', 'globalThis.location.reload()'),
            ],
            'src/pages/admin/AdminPlayersPage.tsx': [
              ('window.location.reload()', 'globalThis.location.reload()'),
            ],
            'src/pages/admin/AdminBranchesPage.tsx': [
              ('window.location.reload()', 'globalThis.location.reload()'),
            ],
          }

          for file_name, pairs in replacements.items():
            path = Path(file_name)
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Expected pattern not found in {file_name}: {old}')
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Static product truth gate
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            'United Olympics Sports Academy'
            'United Olympic Sports Academy'
            'United Olympics Academy'
            'الأكاديمية'
            'demoPlayers[0]'
            '|| 78'
            '|| 60'
            'targetMinutes: 150'
            '+971 4 200 0000'
            'portal@unitedolympicssports.ae'
            'Main Training Pitch'
            'Branch Complex'
            'Sports Training Facility'
            'google-logo.svg'
            'apple-logo.svg'
            'window.location'
          )
          failed=0
          for pattern in "${forbidden[@]}"; do
            if grep -RInF --exclude-dir=node_modules --exclude-dir=dist -- "$pattern" src public; then
              echo "Forbidden product-truth pattern found: $pattern"
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit verified truth closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "origin/main moved; refusing to overwrite newer work"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/product-preview/ProductPreviewPages.tsx src/pages/benchmark/BenchmarkShowcasePage.tsx src/platform/UpdateToast.tsx src/pages/admin/AdminPlayersPage.tsx src/pages/admin/AdminBranchesPage.tsx
          git diff --cached --check
          git commit -m "fix: close product truth gate regressions"
          git push origin HEAD:main
