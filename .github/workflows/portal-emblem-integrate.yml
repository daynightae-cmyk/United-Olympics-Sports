name: Portal Emblem Integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portal-emblem-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply portal emblem integration
        run: python3 .github/scripts/apply_portal_emblems.py

      - name: Install dependencies
        run: npm ci

      - name: Lint and type gate
        run: npm run lint

      - name: Production build gate
        run: npm run build

      - name: Diff integrity gate
        run: git diff --check

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/brand/portalEmblems.ts src/components/brand/PortalEmblem.tsx src/styles/portal-emblems.css src/components/auth/PortalAuthPage.tsx src/layouts/PortalLayout.tsx src/components/admin/AdminSidebar.tsx src/portals/player/PlayerPortalShell.tsx src/store/StoreComponents.tsx qa/portal-emblems.mjs .github/workflows/verify.yml
          git diff --cached --check
          git commit -m "feat: integrate themed portal emblem identities"
          git push origin HEAD:main
