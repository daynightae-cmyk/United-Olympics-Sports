name: Browser QA Dependency Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portal-emblem-integrate.yml

permissions:
  contents: write

jobs:
  close-browser-qa-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin Playwright used by repository browser QA
        run: npm install --save-dev --save-exact playwright@1.63.0

      - name: Lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Commit QA dependency only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "origin/main moved; refusing to overwrite newer work"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "test: pin Playwright browser QA dependency"
          git push origin HEAD:main
