name: Admin Final Browser Certification
on:
  push:
    branches:
      - work/admin-operations-closure-20260906
permissions:
  contents: read
jobs:
  certify-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript gate
        run: npm run lint
      - name: Production build with explicit Admin Preview access
        env:
          VITE_UOS_ADMIN_PREVIEW: 'true'
        run: npm run build
      - name: Diff integrity
        run: git diff --check
      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/admin-final-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/admin-final-preview.log
          exit 1
      - name: Critical CRUD persistence and baseline browser matrix
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
        run: node qa/admin-final-closure.mjs
      - name: Strict Settings theme direction and runtime matrix
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
        run: node qa/admin-theme-runtime-certification.mjs
