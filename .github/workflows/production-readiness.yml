name: Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/server/**'
      - 'src/db/**'
      - 'src/lib/firebase-admin.ts'
      - 'server.ts'
      - 'vercel.json'
      - 'tests/server-contracts.ts'
      - '.github/workflows/production-readiness.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/server/**'
      - 'src/db/**'
      - 'src/lib/firebase-admin.ts'
      - 'server.ts'
      - 'vercel.json'
      - 'tests/server-contracts.ts'
      - '.github/workflows/production-readiness.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify-production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx tests/server-contracts.ts
      - run: npm run build
