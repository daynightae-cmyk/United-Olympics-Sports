name: Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/server/**'
      - 'src/db/**'
      - 'src/lib/firebase-admin.ts'
      - 'src/lib/firebase.ts'
      - 'src/lib/supabase.ts'
      - 'src/lib/auth-client.ts'
      - 'src/components/auth/**'
      - 'src/portals/admin/AdminAccessGate.tsx'
      - 'src/app/AppRouter.tsx'
      - 'server.ts'
      - 'vercel.json'
      - 'tests/server-contracts.ts'
      - 'tests/auth-contracts.ts'
      - '.github/workflows/production-readiness.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/server/**'
      - 'src/db/**'
      - 'src/lib/firebase-admin.ts'
      - 'src/lib/firebase.ts'
      - 'src/lib/supabase.ts'
      - 'src/lib/auth-client.ts'
      - 'src/components/auth/**'
      - 'src/portals/admin/AdminAccessGate.tsx'
      - 'src/app/AppRouter.tsx'
      - 'server.ts'
      - 'vercel.json'
      - 'tests/server-contracts.ts'
      - 'tests/auth-contracts.ts'
      - '.github/workflows/production-readiness.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify-production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - name: Server contracts
        run: npx tsx tests/server-contracts.ts
      - name: Authentication contracts
        run: npx tsx tests/auth-contracts.ts
      - run: npm run build
