name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - rocket-nextjs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
