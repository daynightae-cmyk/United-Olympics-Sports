name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Diff check
        shell: bash
        run: |
          git diff --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          fi

      - name: Static product truth gate
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            'United Olympics Sports Academy'
            'United Olympic Sports Academy'
            'United Olympics Academy'
            'الأكاديمية'
            '|| 78'
            '|| 60'
            'targetMinutes: 150'
            '+971 4 200 0000'
            'portal@unitedolympicssports.ae'
            'Main Training Pitch'
            'Branch Complex'
            'Sports Training Facility'
            'google-logo.svg'
            'apple-logo.svg'
          )
          failed=0
          for pattern in "${forbidden[@]}"; do
            if grep -RInF --exclude-dir=node_modules --exclude-dir=dist -- "$pattern" src public; then
              echo "Forbidden product-truth pattern found: $pattern"
              failed=1
            fi
          done

          if grep -RInF \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='ProductPreviewPages.tsx' \
            --exclude='BenchmarkShowcasePage.tsx' \
            -- 'demoPlayers[0]' src public; then
            echo "Forbidden product-truth pattern found outside preview/benchmark surfaces: demoPlayers[0]"
            failed=1
          fi

          # Portal demo isolation: production portal/admin data paths must not
          # silently consume demo fixtures. Explicit preview surfaces are
          # allowlisted; everything else fails closed.
          if grep -RInE \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --include='*.ts' \
            --include='*.tsx' \
            --exclude='previewAdminGateway.ts' \
            --exclude='previewStoreGateway.ts' \
            --exclude='portalData.ts' \
            --exclude='parentData.ts' \
            --exclude='BenchmarkShowcasePage.tsx' \
            --exclude='ProductPreviewPages.tsx' \
            --exclude='AdminSportDetailPage.tsx' \
            --exclude='AdminAchievementsDetailPage.tsx' \
            --exclude='AdminRegistrationsDetailPage.tsx' \
            --exclude='ParentPortalWorkspaces.tsx' \
            -- "from ['\"][^'\"]*data/demo/" src/portals src/pages/portal src/pages/admin src/admin; then
            echo "Portal demo isolation violation: production portal/admin module imports demo fixtures outside the explicit preview allowlist"
            failed=1
          fi

          exit "$failed"

  build:
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ordinary production build
        run: npm run build

  production-tests:
    name: Production test suite
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live-provider isolated integration
        run: npm run test:production

  browser-qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ordinary production build
        run: npm run build

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          # Playwright uses its bundled browsers; the preinstalled Google Chrome
          # apt source is not required and can briefly publish inconsistent metadata.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps chromium firefox webkit

      - name: Start ordinary production preview
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/uos-production-preview.log 2>&1 &
          echo $! > /tmp/uos-production-preview.pid

      - name: Production provider boundary
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
        run: node qa/production-provider-boundary.mjs

      - name: Stop ordinary production preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/uos-production-preview.pid ]; then
            pid="$(cat /tmp/uos-production-preview.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f /tmp/uos-production-preview.pid
          fi
          sleep 1

      - name: QA production build with explicit preview providers
        env:
          VITE_UOS_ADMIN_PREVIEW: 'true'
          VITE_UOS_STORE_PREVIEW: 'true'
        run: npm run build

      - name: Start QA production preview
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/uos-vite-preview.log 2>&1 &
          echo $! > /tmp/uos-vite-preview.pid

      - name: Browser route and responsive smoke matrix
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
        run: node qa/interface-smoke.mjs

      - name: Stop QA production preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/uos-vite-preview.pid ]; then
            pid="$(cat /tmp/uos-vite-preview.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f /tmp/uos-vite-preview.pid
          fi

      - name: Upload preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: uos-interface-preview-logs
          path: |
            /tmp/uos-production-preview.log
            /tmp/uos-vite-preview.log
          if-no-files-found: ignore

  store-golden-master:
    name: Store Golden Master (${{ matrix.browser }})
    needs: browser-qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: Chromium
            engine: chromium
          - browser: Firefox
            engine: firefox
          - browser: WebKit
            engine: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} runtime
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Build Store QA preview
        env:
          VITE_UOS_ADMIN_PREVIEW: 'true'
          VITE_UOS_STORE_PREVIEW: 'true'
        run: npm run build

      - name: Start isolated Store QA preview
        shell: bash
        run: |
          set -euo pipefail
          log="/tmp/uos-vite-preview-${{ matrix.engine }}.log"
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > "$log" 2>&1 &
          echo $! > /tmp/uos-vite-preview.pid

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/store/shop > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Store QA preview did not become healthy for ${{ matrix.browser }}"
            cat "$log" || true
            exit 1
          fi

      - name: Run Store Golden Master
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
          UOS_STORE_PREVIEW: 'true'
          UOS_QA_BROWSER: ${{ matrix.browser }}
        run: node qa/store-golden-master.mjs

      - name: Stop isolated Store QA preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/uos-vite-preview.pid ]; then
            pid="$(cat /tmp/uos-vite-preview.pid)"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f /tmp/uos-vite-preview.pid
          fi

      - name: Upload Store QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: uos-vite-preview-${{ matrix.engine }}-logs
          path: /tmp/uos-vite-preview-${{ matrix.engine }}.log
          if-no-files-found: ignore