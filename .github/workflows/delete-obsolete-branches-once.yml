name: Delete Obsolete Branches Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-obsolete-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "$branch" = "main" ]; then
              continue
            fi
            echo "Deleting branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Assert main is the only remaining branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branches:\n%s\n' "${remaining[*]}"
          if [ "${#remaining[@]}" -ne 1 ] || [ "${remaining[0]}" != "main" ]; then
            echo "Branch cleanup incomplete"
            exit 1
          fi
