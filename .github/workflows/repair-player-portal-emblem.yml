name: Repair Player Portal Emblem

on:
  push:
    branches:
      - work/production-readiness-continuation-20260907
    paths:
      - '.github/workflows/repair-player-portal-emblem.yml'
      - 'public/brand/portals/player/player-portal-dark.png'

permissions:
  contents: write

jobs:
  repair-player-dark-emblem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: work/production-readiness-continuation-20260907
          fetch-depth: 0

      - name: Install strict PNG decoder
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil

      - name: Decode and deterministically re-encode player dark emblem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import urllib.request
          from PIL import Image, ImageFile

          target = Path('public/brand/portals/player/player-portal-dark.png')
          canonical = 'https://i.postimg.cc/254HnWZV/file-00000000a2b082108f71e1bc43ab05eb.png'

          def decode(payload: bytes, allow_truncated: bool):
              ImageFile.LOAD_TRUNCATED_IMAGES = allow_truncated
              with Image.open(BytesIO(payload)) as image:
                  image.load()
                  if image.width <= 0 or image.height <= 0 or image.width != image.height:
                      raise RuntimeError(f'invalid portal emblem dimensions: {image.width}x{image.height}')
                  return image.convert('RGBA')

          current = target.read_bytes()
          try:
              decoded = decode(current, False)
              source = 'repository'
          except Exception:
              request = urllib.request.Request(canonical, headers={'User-Agent': 'United-Olympics-Sports-Asset-Repair/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  canonical_payload = response.read()
              try:
                  decoded = decode(canonical_payload, False)
                  source = 'canonical-source'
              except Exception:
                  decoded = decode(canonical_payload, True)
                  source = 'canonical-source-salvaged'

          temp = target.with_suffix('.normalized.png')
          decoded.save(temp, format='PNG', optimize=True, compress_level=9)

          # Strictly verify the normalized output with truncation disabled.
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          with Image.open(temp) as check:
              check.verify()
          with Image.open(temp) as check:
              check.load()
              width, height = check.size
              mode = check.mode

          temp.replace(target)
          print(f'NORMALIZED {target} from={source} size={width}x{height} mode={mode} bytes={target.stat().st_size}')
          PY

      - name: Commit normalized binary if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/portals/player/player-portal-dark.png
          if git diff --cached --quiet; then
            echo "Player dark emblem is already normalized."
            exit 0
          fi
          git commit -m "fix: normalize player portal dark emblem PNG"
          git push origin HEAD:work/production-readiness-continuation-20260907
