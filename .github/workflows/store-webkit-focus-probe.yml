name: Store WebKit Focus Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/store-webkit-focus-probe.yml

permissions:
  contents: read

jobs:
  webkit-focus-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Patch candidate Store focus containment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/store/components/useStoreDialog.ts')
          t=p.read_text(encoding='utf-8')
          anchor="    const frame = requestAnimationFrame(() => {\n      const current = panel.current;\n      if (current && !current.contains(document.activeElement)) current.focus({ preventScroll: true });\n    });\n"
          extra="    const onFocusIn = (event: FocusEvent) => {\n      const current = panel.current;\n      if (!current || current.contains(event.target as Node)) return;\n      current.focus({ preventScroll: true });\n    };\n    document.addEventListener('focusin', onFocusIn);\n"
          if extra not in t:
              if anchor not in t: raise SystemExit('focus anchor missing')
              t=t.replace(anchor,anchor+extra,1)
          old="    return () => { cancelAnimationFrame(frame); document.removeEventListener('keydown', onKey); document.body.style.overflow = overflow; inertNodes.forEach(({ node, inert }) => { node.inert = inert; }); if (restore instanceof HTMLElement && restore.isConnected) restore.focus(); };"
          new="    return () => { cancelAnimationFrame(frame); document.removeEventListener('focusin', onFocusIn); document.removeEventListener('keydown', onKey); document.body.style.overflow = overflow; inertNodes.forEach(({ node, inert }) => { node.inert = inert; }); if (restore instanceof HTMLElement && restore.isConnected) restore.focus(); };"
          if new not in t:
              if old not in t: raise SystemExit('cleanup anchor missing')
              t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uos-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uos-preview.log
          exit 1
      - name: Assert WebKit initial focus containment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { webkit } from 'playwright';
          const browser = await webkit.launch({ headless: true });
          try {
            for (const rtl of [false, true]) {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
              await context.addInitScript(({ rtl }) => {
                localStorage.setItem('uos:store-locale', rtl ? 'ar' : 'en');
                localStorage.setItem('uos:store-preview', 'true');
              }, { rtl });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4173/store/shop', { waitUntil: 'networkidle' });
              const trigger = page.locator('.store-mobile-filter');
              await trigger.click();
              const panel = page.locator('.store-filter-layer .store-filters');
              await panel.waitFor();
              const focused = await panel.evaluate((e) => e.contains(document.activeElement));
              if (!focused) throw new Error(`WebKit ${rtl ? 'RTL' : 'LTR'} missing initial focus`);
              for (let i=0;i<16;i++) await page.keyboard.press('Tab');
              const trapped = await panel.evaluate((e) => e.contains(document.activeElement));
              if (!trapped) throw new Error(`WebKit ${rtl ? 'RTL' : 'LTR'} escaped focus trap`);
              await page.keyboard.press('Escape');
              await panel.waitFor({ state:'hidden' });
              await context.close();
            }
            console.log('WebKit Store focus probe PASS');
          } finally {
            await browser.close();
          }
          NODE
