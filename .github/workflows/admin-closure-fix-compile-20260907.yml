name: Admin Closure Compile Fix 20260907
on:
  push:
    branches:
      - work/admin-operations-closure-20260906
    paths:
      - scripts/fix-admin-closure-compile.py
      - .github/workflows/admin-closure-fix-compile-20260907.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply deterministic source fix
        run: python3 scripts/fix-admin-closure-compile.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript gate
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified compile fix
        run: |
          git config user.name "DAY NIGHT DELIVERY SERVICES"
          git config user.email "293348050+daynightae-cmyk@users.noreply.github.com"
          git add src/pages/admin/AdminDirectoryWorkspaces.tsx src/pages/admin/AdminPlayerDetailPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): clear closure TypeScript regressions"
          git pull --rebase origin work/admin-operations-closure-20260906
          git push origin HEAD:work/admin-operations-closure-20260906
