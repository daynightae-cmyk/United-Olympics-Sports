name: Security Lock Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-security-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin patched transitive dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            qs: '6.16.0',
            uuid: '11.1.1',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify production audit is clean
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate dependency graph
        run: npm ci --ignore-scripts
      - name: Commit verified lock refresh and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/security-lock-refresh.yml
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'security: pin patched qs and uuid transitive dependencies'
          git push origin HEAD:main
