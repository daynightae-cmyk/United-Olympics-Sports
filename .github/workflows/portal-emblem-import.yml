name: Portal Emblem Import

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portal-emblem-import.yml

permissions:
  contents: write

jobs:
  import-portal-emblems:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify canonical portal emblem binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import urllib.request

          assets = {
              'public/brand/portals/player/player-portal-light.png': 'https://i.postimg.cc/wBhWDNsS/file-00000000a6748246a62564fefba12450.png',
              'public/brand/portals/player/player-portal-dark.png': 'https://i.postimg.cc/254HnWZV/file-00000000a2b082108f71e1bc43ab05eb.png',
              'public/brand/portals/parent/parent-portal-light.png': 'https://i.postimg.cc/26r0G5Qn/file-000000006e8c81f4818d08f62e30ed57.png',
              'public/brand/portals/parent/parent-portal-dark.png': 'https://i.postimg.cc/DzqC1GXz/file-00000000b8bc81f49c0c617bc9c39618.png',
              'public/brand/portals/coach/coach-portal-light.png': 'https://i.postimg.cc/j5tMcjHn/file-00000000bd7081f4830879233386878b.png',
              'public/brand/portals/coach/coach-portal-dark.png': 'https://i.postimg.cc/63tMcQrM/file-000000009eec81f488583b9c26b76bdf.png',
              'public/brand/portals/admin/admin-portal-light.png': 'https://i.postimg.cc/d08WGCyQ/file-000000002f7081f4b40acf66353599e9.png',
              'public/brand/portals/admin/admin-portal-dark.png': 'https://i.postimg.cc/1zpWDFq4/file-00000000349c81f4a5ec5c5a6192b878.png',
              'public/brand/portals/store/store-light.png': 'https://i.postimg.cc/FRNTpKyF/file-0000000018b482108bc58566d0ba436f.png',
              'public/brand/portals/store/store-dark.png': 'https://i.postimg.cc/G2dXKpFz/file-00000000c6f48246af25802215c68174.png',
          }

          signature = b'\x89PNG\r\n\x1a\n'
          for path_text, url in assets.items():
              path = Path(path_text)
              path.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(url, headers={'User-Agent': 'United-Olympics-Sports-Asset-Importer/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = response.read()
                  content_type = response.headers.get('content-type', '')
              if len(payload) < 64:
                  raise RuntimeError(f'{path}: response too small ({len(payload)} bytes)')
              if not payload.startswith(signature):
                  raise RuntimeError(f'{path}: not a PNG (content-type={content_type!r})')
              if payload[12:16] != b'IHDR':
                  raise RuntimeError(f'{path}: missing IHDR')
              width, height = struct.unpack('>II', payload[16:24])
              if width <= 0 or height <= 0:
                  raise RuntimeError(f'{path}: invalid dimensions {width}x{height}')
              if width != height:
                  raise RuntimeError(f'{path}: portal emblem must be square, got {width}x{height}')
              path.write_bytes(payload)
              print(f'VERIFIED {path} {width}x{height} {len(payload)} bytes {content_type}')
          PY

      - name: Commit repository-owned emblem assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/portals
          if git diff --cached --quiet; then
            echo "Portal emblem assets already present; nothing to commit."
            exit 0
          fi
          git commit -m "assets: add verified portal light and dark emblems"
          git push origin HEAD:main
