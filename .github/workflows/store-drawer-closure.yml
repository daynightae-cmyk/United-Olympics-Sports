name: Store Drawer Closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/store-drawer-closure.yml

permissions:
  contents: write

jobs:
  close-store-drawer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix Store drawer geometry and dialog focus lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('src/styles/store-factory6-enhancements.css')
          css = css_path.read_text(encoding='utf-8')
          css_old = '.store-mini-cart { max-width:100vw; height:100dvh; width:min(460px,100vw); }'
          css_new = (
              '.store-drawer-layer::before,.store-filter-layer::before { content:""; position:absolute; inset:0; z-index:0; background:rgba(0,0,0,.62); backdrop-filter:blur(3px); pointer-events:none; }\n'
              '.store-drawer-layer>.store-drawer-backdrop { z-index:3; inset-block:0!important; inset-inline-start:0!important; inset-inline-end:auto!important; width:24px!important; height:auto!important; background:transparent!important; backdrop-filter:none; }\n'
              '.store-mini-cart { z-index:2; max-width:calc(100vw - 24px); height:100dvh; width:min(460px,calc(100vw - 24px)); }\n'
              '.store-filter-layer>.store-filters { z-index:2; }\n'
              '.store-filter-layer>.store-drawer-backdrop { z-index:3; inset-block:0!important; inset-inline-start:auto!important; inset-inline-end:0!important; width:10%!important; height:auto!important; background:transparent!important; backdrop-filter:none; }'
          )
          if css_old not in css:
              raise SystemExit('Expected final Store mini-cart override not found')
          css_path.write_text(css.replace(css_old, css_new, 1), encoding='utf-8')

          hook_path = Path('src/store/components/useStoreDialog.ts')
          hook = hook_path.read_text(encoding='utf-8')
          hook = hook.replace(
              "import { useEffect, useRef, type RefObject } from 'react';",
              "import { useLayoutEffect, useRef, type RefObject } from 'react';",
              1,
          )
          hook = hook.replace('  useEffect(() => {', '  useLayoutEffect(() => {', 1)
          focus_old = "    document.body.style.overflow = 'hidden';\n    const frame = requestAnimationFrame(() => panel.current?.focus());"
          focus_new = "    document.body.style.overflow = 'hidden';\n    panel.current.focus({ preventScroll: true });\n    const frame = requestAnimationFrame(() => {\n      const current = panel.current;\n      if (current && !current.contains(document.activeElement)) current.focus({ preventScroll: true });\n    });"
          if focus_old not in hook:
              raise SystemExit('Expected Store dialog focus block not found')
          hook = hook.replace(focus_old, focus_new, 1)
          hook_path.write_text(hook, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check

      - name: Install browser matrix
        run: npx playwright install --with-deps

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/uos-store-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uos-store-preview.log
          exit 1

      - name: Store Golden Master
        env:
          UOS_BASE_URL: http://127.0.0.1:4173
        run: node qa/store-golden-master.mjs

      - name: Commit verified Store fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "origin/main moved; refusing to overwrite newer work"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/store-factory6-enhancements.css src/store/components/useStoreDialog.ts
          git diff --cached --check
          git commit -m "fix: stabilize Store drawer interactions across browsers"
          git push origin HEAD:main
