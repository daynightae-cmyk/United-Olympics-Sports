<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">United Olympics Sports connected product surfaces</title>
  <desc id="description">One shared United Olympics Sports core connected to a public website, super admin, player portal, parent portal and coach portal, with source-verified preview capabilities.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04101F"/>
      <stop offset="1" stop-color="#071B31"/>
    </linearGradient>
    <linearGradient id="core" x1="490" y1="90" x2="910" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132A43"/>
      <stop offset="1" stop-color="#081523"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#10243A"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <radialGradient id="coreAura" cx="0" cy="0" r="1" gradientTransform="translate(700 168) rotate(90) scale(245 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#A6BAD0" stroke-opacity="0.035"/>
    </pattern>
    <filter id="nodeGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="18" fill="url(#background)"/>
  <rect width="1400" height="820" rx="18" fill="url(#coreAura)"/>
  <rect x="1" y="1" width="1398" height="818" rx="17" fill="none" stroke="#D4AF37" stroke-opacity="0.25"/>
  <rect x="25" y="25" width="1350" height="770" rx="12" fill="url(#grid)"/>

  <!-- Shared ecosystem topology -->
  <g fill="none" stroke="#D4AF37" stroke-opacity="0.58" stroke-width="2">
    <path d="M700 242V292H265V332"/>
    <path d="M700 242V332"/>
    <path d="M700 242V292H1135V332"/>
    <path d="M1135 558V600H840V634"/>
    <path d="M1135 558V600H1135V634"/>
    <path d="M1135 558V600H545V634"/>
  </g>
  <g fill="#D4AF37">
    <circle cx="700" cy="292" r="8" fill-opacity="0.2" filter="url(#nodeGlow)"/>
    <circle cx="700" cy="292" r="4"/>
    <circle cx="265" cy="332" r="5"/>
    <circle cx="700" cy="332" r="5"/>
    <circle cx="1135" cy="332" r="5"/>
    <circle cx="545" cy="634" r="5"/>
    <circle cx="840" cy="634" r="5"/>
    <circle cx="1135" cy="634" r="5"/>
  </g>

  <!-- Official shared core label; the raster logo itself is shown directly above this artwork in README -->
  <g>
    <rect x="490" y="90" width="420" height="152" rx="18" fill="url(#core)" stroke="#D4AF37" stroke-opacity="0.72"/>
    <path d="M520 123h48M832 123h48M520 209h48M832 209h48" stroke="#D4AF37" stroke-opacity="0.42"/>
    <circle cx="700" cy="117" r="5" fill="#D4AF37"/>
    <text x="700" y="158" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="2.5">UNITED OLYMPICS SPORTS</text>
    <text x="700" y="194" text-anchor="middle" fill="#E0C15B" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="600" direction="rtl" unicode-bidi="plaintext">يونايتد أوليمبيكس سبورت</text>
    <text x="700" y="216" text-anchor="middle" fill="#8FA8BF" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">SHARED PRODUCT CORE</text>
    <text x="700" y="233" text-anchor="middle" fill="#8FA8BF" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11" direction="rtl" unicode-bidi="plaintext">نواة المنتج المشتركة</text>
  </g>

  <!-- Public website -->
  <g transform="translate(80 332)">
    <rect width="370" height="226" rx="14" fill="url(#panel)" stroke="#3AA9E8" stroke-opacity="0.55"/>
    <rect width="370" height="4" rx="2" fill="#3AA9E8"/>
    <circle cx="44" cy="47" r="18" fill="none" stroke="#3AA9E8"/>
    <path d="M26 47h36M44 29c9 10 9 26 0 36M44 29c-9 10-9 26 0 36" fill="none" stroke="#3AA9E8" stroke-opacity="0.72"/>
    <text x="76" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2">PUBLIC WEBSITE</text>
    <text x="342" y="66" text-anchor="start" fill="#9CB5CC" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="14" direction="rtl" unicode-bidi="plaintext">الموقع العام</text>
    <line x1="24" y1="90" x2="346" y2="90" stroke="#3AA9E8" stroke-opacity="0.25"/>
    <g fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12.5">
      <text x="28" y="122">01  Sport Experience</text>
      <text x="28" y="150">02  Program Discovery</text>
      <text x="28" y="178">03  Coaching Experience</text>
      <text x="28" y="206">04  Portal Access</text>
    </g>
    <text x="342" y="122" text-anchor="start" fill="#91A9BE" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">تجربة الرياضات</text>
    <text x="342" y="150" text-anchor="start" fill="#91A9BE" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">اكتشاف البرامج</text>
    <text x="342" y="178" text-anchor="start" fill="#91A9BE" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">تجربة المدربين</text>
    <text x="342" y="206" text-anchor="start" fill="#91A9BE" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">الوصول للبوابات</text>
  </g>

  <!-- Super admin -->
  <g transform="translate(515 332)">
    <rect width="370" height="226" rx="14" fill="url(#panel)" stroke="#D4AF37" stroke-opacity="0.7"/>
    <rect width="370" height="4" rx="2" fill="#D4AF37"/>
    <rect x="27" y="29" width="34" height="36" rx="4" fill="none" stroke="#D4AF37"/>
    <path d="M34 40h20M34 48h20M34 56h12" stroke="#D4AF37"/>
    <text x="76" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2">SUPER ADMIN</text>
    <text x="342" y="66" text-anchor="start" fill="#CBB66E" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="14" direction="rtl" unicode-bidi="plaintext">الإدارة الرئيسية</text>
    <line x1="24" y1="90" x2="346" y2="90" stroke="#D4AF37" stroke-opacity="0.28"/>
    <g fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12.5">
      <text x="28" y="122">01  Organization Structure</text>
      <text x="28" y="150">02  Sports &amp; Programs</text>
      <text x="28" y="178">03  People &amp; Groups</text>
      <text x="28" y="206">04  Training Operations</text>
    </g>
    <text x="342" y="122" text-anchor="start" fill="#B3A36D" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">هيكل المؤسسة</text>
    <text x="342" y="150" text-anchor="start" fill="#B3A36D" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">الرياضات والبرامج</text>
    <text x="342" y="178" text-anchor="start" fill="#B3A36D" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">الأشخاص والمجموعات</text>
    <text x="342" y="206" text-anchor="start" fill="#B3A36D" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="11.5" direction="rtl" unicode-bidi="plaintext">عمليات التدريب</text>
  </g>

  <!-- Portals group -->
  <g transform="translate(950 332)">
    <rect width="370" height="226" rx="14" fill="url(#panel)" stroke="#6888A6" stroke-opacity="0.6"/>
    <rect width="370" height="4" rx="2" fill="#698EAE"/>
    <circle cx="44" cy="47" r="17" fill="none" stroke="#7FA3C2"/>
    <circle cx="44" cy="42" r="5" fill="none" stroke="#7FA3C2"/>
    <path d="M34 58c4-9 16-9 20 0" fill="none" stroke="#7FA3C2"/>
    <text x="76" y="43" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2">ROLE PORTALS</text>
    <text x="342" y="66" text-anchor="start" fill="#9CB5CC" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="14" direction="rtl" unicode-bidi="plaintext">بوابات المستخدمين</text>
    <line x1="24" y1="90" x2="346" y2="90" stroke="#7FA3C2" stroke-opacity="0.3"/>
    <text x="185" y="130" text-anchor="middle" fill="#D4AF37" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">ONE CONNECTED TRAINING VIEW</text>
    <text x="185" y="158" text-anchor="middle" fill="#AABBCB" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="14" direction="rtl" unicode-bidi="plaintext">تجربة تدريب مترابطة حسب الدور</text>
    <g fill="#7997B2">
      <circle cx="94" cy="190" r="5"/><circle cx="185" cy="190" r="5"/><circle cx="276" cy="190" r="5"/>
    </g>
    <path d="M94 190h182" stroke="#7997B2" stroke-opacity="0.5"/>
  </g>

  <!-- Player portal -->
  <g transform="translate(405 634)">
    <rect width="280" height="184" rx="13" fill="url(#panel)" stroke="#3AA9E8" stroke-opacity="0.55"/>
    <text x="20" y="30" fill="#3AA9E8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1">PLAYER PORTAL</text>
    <text x="260" y="51" text-anchor="start" fill="#9CB5CC" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="12" direction="rtl" unicode-bidi="plaintext">بوابة اللاعب</text>
    <line x1="20" y1="62" x2="260" y2="62" stroke="#3AA9E8" stroke-opacity="0.24"/>
    <text x="20" y="84" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12">Overview · Attendance</text>
    <text x="260" y="103" text-anchor="start" fill="#8FA8BF" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">نظرة عامة · حضور</text>
    <text x="20" y="126" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12">Performance · Feedback</text>
    <text x="260" y="145" text-anchor="start" fill="#8FA8BF" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">أداء · ملاحظات</text>
    <text x="20" y="170" fill="#6888A6" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1">UI PREVIEW</text>
    <text x="260" y="170" text-anchor="start" fill="#6888A6" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10" direction="rtl" unicode-bidi="plaintext">معاينة واجهة</text>
  </g>

  <!-- Parent portal -->
  <g transform="translate(700 634)">
    <rect width="280" height="184" rx="13" fill="url(#panel)" stroke="#D4AF37" stroke-opacity="0.55"/>
    <text x="20" y="30" fill="#D4AF37" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1">PARENT PORTAL</text>
    <text x="260" y="51" text-anchor="start" fill="#BFAE76" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="12" direction="rtl" unicode-bidi="plaintext">بوابة ولي الأمر</text>
    <line x1="20" y1="62" x2="260" y2="62" stroke="#D4AF37" stroke-opacity="0.24"/>
    <text x="20" y="84" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12">Children · Attendance</text>
    <text x="260" y="103" text-anchor="start" fill="#AFA171" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">الأبناء · الحضور</text>
    <text x="20" y="126" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="11.2">Performance · Schedule Preview</text>
    <text x="260" y="145" text-anchor="start" fill="#AFA171" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">الأداء · معاينة الجدول</text>
    <text x="20" y="170" fill="#776D4C" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1">UI PREVIEW</text>
    <text x="260" y="170" text-anchor="start" fill="#8C815B" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10" direction="rtl" unicode-bidi="plaintext">معاينة واجهة</text>
  </g>

  <!-- Coach portal -->
  <g transform="translate(995 634)">
    <rect width="280" height="184" rx="13" fill="url(#panel)" stroke="#3AA9E8" stroke-opacity="0.55"/>
    <text x="20" y="30" fill="#3AA9E8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="1">COACH PORTAL</text>
    <text x="260" y="51" text-anchor="start" fill="#9CB5CC" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="12" direction="rtl" unicode-bidi="plaintext">بوابة المدرب</text>
    <line x1="20" y1="62" x2="260" y2="62" stroke="#3AA9E8" stroke-opacity="0.24"/>
    <text x="20" y="84" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="12">Groups · Players</text>
    <text x="260" y="103" text-anchor="start" fill="#8FA8BF" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">المجموعات · اللاعبون</text>
    <text x="20" y="126" fill="#B8C7D6" font-family="Arial, Helvetica, sans-serif" font-size="10.7">Attendance Workflow · Evaluations</text>
    <text x="260" y="145" text-anchor="start" fill="#8FA8BF" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10.5" direction="rtl" unicode-bidi="plaintext">سير الحضور · التقييمات</text>
    <text x="20" y="170" fill="#6888A6" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1">UI PREVIEW</text>
    <text x="260" y="170" text-anchor="start" fill="#6888A6" font-family="Arial, 'Noto Sans Arabic', sans-serif" font-size="10" direction="rtl" unicode-bidi="plaintext">معاينة واجهة</text>
  </g>
</svg>
